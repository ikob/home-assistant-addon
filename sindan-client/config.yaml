name: SINDAN-client
version: "0.1.2"
slug: sindan-client
description: Home Assistant Add-on for SINDAN-client
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
init: false
host_network: true
privileged:
  - NET_ADMIN
options:
  mode: "SINDAN"
  url_campaign: http://fluentd.sindan-net.com:8888/sindan.log_campaign
  url_sindan: http://fluentd.sindan-net.com:8888/sindan.log
  verbose: false
  ssh4_srvs: fluentd.sindan-net.com
  ssh6_srvs: fluentd.sindan-net.com
  os_url: https://172.27.160.35/opensearch
  os_index_prefix: sindan-wifi
  os_host: ""
  os_user: admin
  os_pass: ""
  os_insecure: true
schema:
  mode: "list(SINDAN|perfSONAR)"
  url_campaign: url
  url_sindan: url
  verbose: bool
  ssh4_srvs: str
  ssh6_srvs: str
  os_url: str
  os_index_prefix: str
  os_host: "str?"
  os_user: str
  os_pass: "password?"
  os_insecure: bool
